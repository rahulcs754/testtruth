# Copy to .github/workflows/testtruth.yml in your repo.
name: TestTruth
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  testtruth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: rahulcs754/testtruth@main
        with:
          threshold: 60
          fail-on-low: false
